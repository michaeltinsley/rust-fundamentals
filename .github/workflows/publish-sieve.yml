name: Publish Sieve of Eratosthenes Crate

on:
  release:
    types: [published]

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    name: Run CI Checks
    # Only run checks if this is actually a sieve release tag
    if: endsWith(github.event.release.tag_name, '-soe')
    uses: ./.github/workflows/rust-ci.yml

  publish-sieve:
    name: Publish Sieve of Eratosthenes
    runs-on: ubuntu-latest
    needs: ci
    if: endsWith(github.event.release.tag_name, '-soe')

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Crates.io Login
        uses: rust-lang/crates-io-auth-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Version
        shell: bash
        run: |
          TAG_VERSION=${GITHUB_REF_NAME#v}
          TAG_VERSION=${TAG_VERSION%-soe}
          CARGO_VERSION=$(grep '^version =' exercises/sieve-of-eratosthenes/Cargo.toml | cut -d '"' -f 2)
          if [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
            echo "Error: Tag ($TAG_VERSION) != Cargo.toml ($CARGO_VERSION)"
            exit 1
          fi

      - name: Publish to Crates.io
        run: cargo publish -p sieve-of-eratosthenes
